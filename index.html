<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Saddam & Jidah Wedding - Live Comments Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #e5ba73;
            --bg-dark: #1a120b;
            --accent: #8c3333;
            --font-pixel: 'Press Start 2P', cursive;
            --font-clear: 'Arial', sans-serif;
        }

        * { box-sizing: border-box; }
        
        body { 
            margin: 0; padding: 0; background-color: #000;
            display: grid; place-items: center; min-height: 100vh;
            overflow: hidden;
            user-select: none; -webkit-user-select: none;
        }

        #viewport {
            position: relative; width: 100%; max-width: 450px; height: 100vh; max-height: 800px;
            box-shadow: 0 0 50px rgba(0,0,0,0.8); overflow: hidden; background: #000;
        }

        /* --- MAIN MENU COVER --- */
        #cover-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 100;
            background-color: #1a120b;
            transition: opacity 0.8s ease-in-out, visibility 0.8s;
            opacity: 1;
            visibility: visible;
        }

        .bg-menu-img {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover;
            image-rendering: pixelated; z-index: 1;
        }

        #stars-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2; pointer-events: none;
        }

        .scanlines {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.12) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 118, 0.02));
            background-size: 100% 3px, 3px 100%; z-index: 3; pointer-events: none;
        }

        .star {
            position: absolute; background: #ffffff; width: 3px; height: 3px; border-radius: 50%;
            opacity: 0; animation: twinkle 2.5s infinite ease-in-out; box-shadow: 0 0 6px #fff;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0; transform: scale(0.4); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .menu-ui {
            position: relative; z-index: 10; height: 100%;
            display: flex; flex-direction: column; align-items: center;
        }

        .btn-buka {
            position: absolute; top: 62%;
            font-family: var(--font-pixel);
            background: #d4823a; color: #fff;
            border: 4px solid #1a120b; padding: 14px 22px;
            font-size: 11px; cursor: pointer; border-radius: 4px;
            box-shadow: 0 6px 0 #8c3333;
            animation: pulse 1.5s infinite;
        }
        .btn-buka:active { transform: translateY(4px); box-shadow: 0 2px 0 #8c3333; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.03); } 100% { transform: scale(1); } }

        /* --- INTERACTIVE ROOM --- */
        #room-screen {
            position: absolute; width: 100%; height: 100%; display: none;
            font-family: var(--font-clear);
        }

        .bg-room {
            width: 100%; height: 100%; object-fit: fill; image-rendering: pixelated;
        }

        .hotspot {
            position: absolute; cursor: pointer; display: flex; align-items: center; justify-content: center;
            -webkit-tap-highlight-color: transparent; z-index: 10;
        }

        #click-undangan  { top: 45%; left: 4%; width: 23%; height: 15%; }  
        #click-laptop    { top: 44%; left: 32%; width: 38%; height: 17%; } 
        #click-perjalanan { top: 61%; left: 47%; width: 21%; height: 6%; }  
        #click-foto      { top: 9%; left: 30%; width: 42%; height: 24%; }  
        #click-hadiah    { top: 82%; left: 10%; width: 27%; height: 15%; } 

        .label {
            position: absolute; background: var(--bg-dark); color: var(--primary);
            font-size: 13px; padding: 6px 12px; border: 2px solid var(--primary);
            border-radius: 4px; white-space: nowrap; font-weight: bold; pointer-events: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.7);
        }

        #click-foto .label { bottom: -22px; }
        #click-laptop .label { top: -28px; }
        #click-undangan .label { bottom: -22px; }
        #click-perjalanan .label { bottom: -22px; }
        #click-hadiah .label { top: -28px; }

        /* --- MODAL POPUP WINDOW --- */
        .modal-overlay {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 200; justify-content: center; align-items: center;
            padding: 20px; font-family: var(--font-clear);
        }

        .modal-content {
            background: #2c1a11; border: 3px solid var(--primary); width: 100%;
            max-height: 85%; overflow-y: auto; display: flex; flex-direction: column;
            border-radius: 4px; position: relative;
        }

        .modal-header { padding: 15px; text-align: center; border-bottom: 2px dashed var(--primary); }
        .modal-header h3 { margin: 0; font-family: var(--font-pixel); font-size: 11px; color: var(--primary); line-height: 1.5; }

        .modal-body { padding: 20px; text-align: center; color: #fff; line-height: 1.6; font-size: 16px; font-weight: bold; }

        .btn-back {
            background: var(--bg-dark); color: var(--primary); border: none;
            padding: 15px; font-family: var(--font-pixel); font-size: 11px;
            cursor: pointer; border-top: 2px solid var(--primary); font-weight: bold;
        }
        .btn-back:active { background: #3c2a21; }

        /* --- CSS LIVE COMMENTS AREA --- */
        .comments-container {
            margin-top: 25px;
            border-top: 2px dashed var(--primary);
            padding-top: 15px;
            text-align: left;
        }
        .comments-title {
            font-size: 14px;
            color: var(--primary);
            margin-bottom: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }
        .comments-list {
            max-height: 250px;
            overflow-y: auto;
            padding-right: 5px;
        }
        .comment-item {
            background: #1a120b;
            border: 1px solid #4a3423;
            padding: 10px 12px;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        .comment-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }
        .comment-user {
            color: var(--primary);
            font-size: 14px;
            font-weight: bold;
        }
        .comment-status {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: bold;
        }
        .status-hadir { background: #557a46; color: #fff; }
        .status-ragu { background: #d4823a; color: #fff; }
        .status-absen { background: #8c3333; color: #fff; }
        .comment-text {
            color: #eee;
            font-size: 13px;
            font-weight: normal;
            word-break: break-word;
            line-height: 1.4;
        }
        .no-comment {
            text-align: center;
            color: #888;
            font-size: 13px;
            padding: 15px 0;
        }

        /* --- CSS GRID UNTUK GALERI FOTO P1-P4 --- */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 10px;
        }
        .gallery-item {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border: 2px solid var(--primary);
            border-radius: 4px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .gallery-item:hover { transform: scale(1.03); }

        /* --- STYLING UTILS --- */
        #music-btn {
            position: absolute; top: 15px; right: 15px; z-index: 150;
            background: rgba(0,0,0,0.7); color: var(--primary); border: 1px solid var(--primary);
            width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: none;
            align-items: center; justify-content: center; font-size: 20px;
        }

        .btn-wa {
            display: block; width: 100%; background: #557a46; color: white;
            padding: 12px; text-decoration: none; border-radius: 4px; margin-top: 15px;
            font-weight: bold; font-size: 14px; text-align: center;
        }

        .copy-card {
            background: #1a120b; padding: 15px; border-radius: 4px; border: 1px solid var(--primary);
            margin: 15px 0; text-align: left;
        }
        .input-form { width: 100%; padding: 12px; margin: 8px 0; background-color: #1a120b; border: 1px solid var(--primary); color: #fff; font-family: var(--font-clear); font-size: 14px; font-weight: bold; }
        ::placeholder { color: #888; }

        .lightbox-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 300; justify-content: center; align-items: center;
        }
        .lightbox-img { max-width: 90%; max-height: 80%; border: 3px solid var(--primary); border-radius: 4px; }
    </style>
</head>
<body>

    <audio id="bg-audio" loop>
        <source src="musik.mp3" type="audio/mpeg">
    </audio>

    <div id="viewport">
        <button id="music-btn" onclick="toggleAudio()">🔊</button>

        <div id="cover-screen">
            <img src="bg_menu.png" class="bg-menu-img">
            <div id="stars-container"></div>
            <div class="scanlines"></div>
            <div class="menu-ui">
                <button class="btn-buka" onclick="startApp()">BUKA UNDANGAN</button>
            </div>
        </div>

        <div id="room-screen">
            <img src="bg.png" class="bg-room">
            <div id="hotspots">
                <div class="hotspot" id="click-undangan" onclick="showModal('detail')"><span class="label">📜 Detail Undangan</span></div>
                <div class="hotspot" id="click-laptop" onclick="showModal('rsvp')"><span class="label">💻 Buku Tamu & Ucapan</span></div>
                <div class="hotspot" id="click-perjalanan" onclick="showModal('story')"><span class="label">🖋️ Cerita Kami</span></div>
                <div class="hotspot" id="click-foto" onclick="showModal('gallery')"><span class="label">🖼️ Galeri Foto</span></div>
                <div class="hotspot" id="click-hadiah" onclick="showModal('gift')"><span class="label">🎁 Kirim Hadiah</span></div>
            </div>
        </div>

        <div id="modal-overlay" class="modal-overlay">
            <div class="modal-content">
                <div class="modal-header"><h3 id="modal-title">TITLE</h3></div>
                <div class="modal-body" id="modal-body"></div>
                <button class="btn-back" onclick="hideModal()">KEMBALI KE KAMAR</button>
            </div>
        </div>

        <div id="lightbox" class="lightbox-overlay" onclick="this.style.display='none'">
            <img id="lightbox-img" class="lightbox-img" src="">
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwXm44Zjc_DIupMFZrcSi0kgh-QszC_JVrK8No9D-GfjZWdbLS2EH0kBKwMBhVOLMd5/exec";
        
        const audio = document.getElementById('bg-audio');
        const mBtn = document.getElementById('music-btn');

        function generateStars() {
            const container = document.getElementById('stars-container');
            if(!container) return;
            const totalStars = 30;
            for (let i = 0; i < totalStars; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 45 + '%';
                star.style.animationDelay = Math.random() * 2.5 + 's';
                container.appendChild(star);
            }
        }
        generateStars();

        function startApp() {
            const cover = document.getElementById('cover-screen');
            const room = document.getElementById('room-screen');
            room.style.display = "block";
            cover.style.opacity = "0";
            cover.style.visibility = "hidden";
            audio.play().catch(() => console.log("Autoplay di-block"));
            mBtn.style.display = "flex";
        }

        function toggleAudio() {
            if (audio.paused) { audio.play(); mBtn.innerText = "🔊"; }
            else { audio.pause(); mBtn.innerText = "🔇"; }
        }

        function openLightbox(src) {
            const lb = document.getElementById('lightbox');
            const lbImg = document.getElementById('lightbox-img');
            lbImg.src = src;
            lb.style.display = 'flex';
        }

        function muatUcapan() {
            const listContainer = document.getElementById('comments-list');
            if(!listContainer) return;

            listContainer.innerHTML = '<p class="no-comment">Mengambil data ucapan...</p>';

            fetch(SCRIPT_URL)
                .then(response => response.json())
                .then(data => {
                    if(data.length === 0) {
                        listContainer.innerHTML = '<p class="no-comment">Belum ada ucapan. Jadilah yang pertama!</p>';
                        return;
                    }
                    
                    listContainer.innerHTML = '';
                    data.forEach(item => {
                        let statusClass = 'status-hadir';
                        if(item.kehadiran.includes('Ragu')) statusClass = 'status-ragu';
                        if(item.kehadiran.includes('Maaf') || item.kehadiran.includes('Berhalangan')) statusClass = 'status-absen';

                        const itemHtml = `
                            <div class="comment-item">
                                <div class="comment-meta">
                                    <span class="comment-user">${escapeHtml(item.nama)}</span>
                                    <span class="comment-status ${statusClass}">${escapeHtml(item.kehadiran)}</span>
                                </div>
                                <div class="comment-text">${escapeHtml(item.ucapan)}</div>
                            </div>
                        `;
                        listContainer.innerHTML += itemHtml;
                    });
                })
                .catch(err => {
                    console.error(err);
                    listContainer.innerHTML = '<p class="no-comment" style="color:var(--accent);">Gagal memuat ucapan :(</p>';
                });
        }

        function escapeHtml(text) {
            return text ? text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;") : '';
        }

        function kirimRSVP() {
            const btn = document.getElementById('btn-kirim-rsvp');
            const nama = document.getElementById('in-nama').value.trim();
            const status = document.getElementById('in-status').value;
            const doa = document.getElementById('in-doa').value.trim();

            if(!nama || !doa) return alert("Isi Nama dan Ucapan Anda terlebih dahulu!");

            btn.disabled = true;
            btn.innerText = "SEDANG MENGIRIM...";

            const payload = {
                nama: nama,
                kehadiran: status,
                ucapan: doa
            };

            fetch(SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(res => {
                if(res.result === "success") {
                    alert("Ucapan Anda berhasil dikirim langsung ke memori kenangan kami!");
                    document.getElementById('in-nama').value = '';
                    document.getElementById('in-doa').value = '';
                    muatUcapan();
                } else {
                    alert("Gagal mengirim ucapan: " + res.message);
                }
            })
            .catch(err => {
                console.error(err);
                alert("Terjadi gangguan jaringan, silakan coba lagi!");
            })
            .finally(() => {
                btn.disabled = false;
                btn.innerText = "🚀 KIRIM UCAPAN DIGITAL";
            });
        }

        function showModal(type) {
            const modal = document.getElementById('modal-overlay');
            const title = document.getElementById('modal-title');
            const body = document.getElementById('modal-body');
            modal.style.display = 'flex';

            if (type === 'detail') {
                title.innerText = "DETAIL ACARA PERNIKAHAN";
                body.innerHTML = `
                    <p style="color:var(--primary); font-size:20px; margin-bottom:10px; font-weight:bold;">SADDAM & NURMAJIDAH</p>
                    <p style="font-size:14px; color:#ddd; margin-bottom:20px;">Dengan memohon rahmat Allah SWT, kami mengundang Bapak/Ibu/Saudara/i ke acara pernikahan kami:</p>
                    
                    <div style="background:#1a120b; padding:15px; margin:10px 0; border:2px solid var(--primary); text-align:left; border-radius:4px;">
                        <span style="background:var(--primary); color:#000; font-size:11px; padding:3px 8px; font-weight:900;">ACARA MEMPELAI WANITA (AKAD & RESEPSI)</span>
                        <p style="margin:12px 0 6px 0; font-size:15px;"><b>Hari, Tanggal:</b> Sabtu, 15 Agustus 2026</p>
                        <p style="margin:6px 0 6px 0; font-size:15px;"><b>Waktu:</b> 08:00 WITA - Selesai</p>
                        <p style="margin:6px 0 12px 0; font-size:15px;"><b>Lokasi:</b> Kediaman Mempelai Wanita</p>
                        
                        <a href="https://maps.app.goo.gl/FLNX9ep2mk9STGwDA" target="_blank" class="btn-wa">🗺️ BUKA GOOGLE MAPS LOKASI 1</a>
                    </div>
                    
                    <div style="background:#1a120b; padding:15px; border:2px solid var(--accent); text-align:left; border-radius:4px;">
                        <span style="background:var(--accent); color:#fff; font-size:11px; padding:3px 8px; font-weight:900;">RESEPSI UNDUH MANTU (PIHAK PRIA)</span>
                        <p style="margin:12px 0 6px 0; font-size:15px;"><b>Hari, Tanggal:</b> Kamis, 08 Oktober 2026 (Tentatif)</p>
                        <p style="margin:6px 0 6px 0; font-size:15px;"><b>Waktu:</b> 08:00 WITA - Selesai</p>
                        <p style="margin:6px 0 12px 0; font-size:15px;"><b>Lokasi:</b> Kediaman Mempelai Pria</p>
                        
                        <a href="https://maps.app.goo.gl/8B3fMY7RoXM9CUw37" target="_blank" class="btn-wa" style="background:var(--accent)">🗺️ BUKA GOOGLE MAPS LOKASI 2</a>
                    </div>`;
            } else if (type === 'rsvp') {
                title.innerText = "BUKU TAMU DIGITAL & UCAPAN";
                body.innerHTML = `
                    <p style="font-size:14px; margin-bottom:15px; color:#ddd;">Silakan isi buku tamu untuk mengirimkan doa restu Anda secara live:</p>
                    <input type="text" id="in-nama" class="input-form" placeholder="Ketik Nama Lengkap Anda">
                    <select id="in-status" class="input-form">
                        <option>Saya Akan Hadir</option>
                        <option>Masih Ragu-ragu</option>
                        <option>Maaf, Berhalangan Hadir</option>
                    </select>
                    <textarea id="in-doa" class="input-form" rows="4" placeholder="Tulis Ucapan Selamat & Doa Restu Di Sini..."></textarea>
                    <button id="btn-kirim-rsvp" onclick="kirimRSVP()" class="btn-wa" style="background:var(--primary); color:#000; font-size:14px; width:100%; cursor:pointer; margin-top:10px; border:none;">🚀 KIRIM UCAPAN DIGITAL</button>
                    
                    <div class="comments-container">
                        <div class="comments-title">💬 UCAPAN DAN DOA</div>
                        <div class="comments-list" id="comments-list"></div>
                    </div>`;
                muatUcapan();
            } else if (type === 'story') {
                title.innerText = "OUR LOVE STORY";
                body.innerHTML = `
                    <div style="text-align:left; font-size:15px;">
                        <div style="border-left:4px solid var(--primary); padding-left:15px; margin-bottom:20px;">
                            <p style="color:var(--primary); font-weight:bold; margin:0; font-size:17px;">2015 - Satu Sekolah</p>
                            <p style="margin:6px 0 0 0; text-align:justify; color:#eee; font-weight:normal;">Kami pernah berada di sekolah dan kelas yg sama, menjalani hari-hari di lingkungan yang sama. Namun saat itu kami hanyalah dua orang teman sekelas biasa, tidak ada rasa dan tidak pernah terbayang terpikir bisa menjalin hubungan lebih.</p>
                        </div>
                        <div style="border-left:4px solid var(--primary); padding-left:15px; margin-bottom:20px;">
                            <p style="color:var(--primary); font-weight:bold; margin:0; font-size:17px;">2018 - Mulai Dekat</p>
                            <p style="margin:6px 0 0 0; text-align:justify; color:#eee; font-weight:normal;">Seiring berjalannya waktu kami memiliki komunikasi yang lebih intens karena sama-sama ingin memasuki universitas yang sama. Dari situ kami mulai merasa nyaman dan menemukan bahwa ada banyak hal yang bisa kami bagi bersama.</p>
                        </div>
                        <div style="border-left:4px solid var(--primary); padding-left:15px;">
                            <p style="color:var(--primary); font-weight:bold; margin:0; font-size:17px;">2026 - Jadi Tujuan</p>
                            <p style="margin:6px 0 0 0; text-align:justify; color:#eee; font-weight:normal;">Dari dua orang teman sekelas, kini kami berjalan menuju arah yang sama. Perjalanan ini membawa kami pada sebuah keyakinan bahwa kebersamaan ini bukan lagi tentang kebetulan, melainkan sebuah tujuan yang ingin kami jalani bersama.</p>
                        </div>
                    </div>`;
            } else if (type === 'gallery') {
                title.innerText = "PREWEDDING GALLERY";
                body.innerHTML = `
                    <p style="font-size:14px; margin-bottom:15px; color:#ddd;">Klik foto untuk memperbesar tampilan</p>
                    <div class="gallery-grid">
                        <img src="p1.jpg" class="gallery-item" onclick="openLightbox('p1.jpg')">
                        <img src="p2.jpg" class="gallery-item" onclick="openLightbox('p2.jpg')">
                        <img src="p3.jpg" class="gallery-item" onclick="openLightbox('p3.jpg')">
                        <img src="p4.jpg" class="gallery-item" onclick="openLightbox('p4.jpg')">
                    </div>`;
            } else if (type === 'gift') {
                title.innerText = "WEDDING GIFT VIRTUAL";
                body.innerHTML = `
                    <p style="font-size:15px; margin-bottom:20px;">Bagi keluarga dan rekan yang ingin mengirimkan tanda kasih virtual, dapat melalui rekening di bawah ini:</p>
                    <div class="copy-card">
                        <p style="margin:0; font-weight:bold; color:var(--primary); font-size:13px;">BANK BCA</p>
                        <p style="font-size:24px; color:#fff; font-weight:bold; margin:5px 0;">782-052-2090</p>
                        <p style="margin:0 0 12px 0; font-size:14px; color:#ccc;">a.n. Saddam Muhammad Al-Khadaffi</p>
                        <button onclick="navigator.clipboard.writeText('7820522090'); alert('No. Rekening BCA Saddam Berhasil Disalin!')" style="background:var(--bg-dark); border:1px solid var(--primary); color:var(--primary); padding:8px 15px; cursor:pointer; font-weight:bold; font-size:13px; border-radius:4px;">📋 Salin No. Rekening</button>
                    </div>
                    <div class="copy-card">
                        <p style="margin:0; font-weight:bold; color:var(--primary); font-size:13px;">E-WALLET DANA</p>
                        <p style="font-size:24px; color:#fff; font-weight:bold; margin:5px 0;">0895-7009-10063</p>
                        <p style="margin:0 0 12px 0; font-size:14px; color:#ccc;">a.n. Saddam Muhammad Al-Khadaffi</p>
                        <button onclick="navigator.clipboard.writeText('0895700910063'); alert('Nomor DANA Saddam Berhasil Disalin!')" style="background:var(--bg-dark); border:1px solid var(--primary); color:var(--primary); padding:8px 15px; cursor:pointer; font-weight:bold; font-size:13px; border-radius:4px;">📋 Salin Nomor DANA</button>
                    </div>`;
            }
        }

        function hideModal() { document.getElementById('modal-overlay').style.display = 'none'; }
    </script>
</body>
</html>
